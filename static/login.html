<!-- SK-pilot (СК-пилот) — система ежедневных сводок строительного контроля.
     Автор: Vladislav Nikonenko (идея и разработка). © 2026. Версия 1.3. -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Сводка СК</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;900&family=Roboto:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f3f9;--surface:#fff;--border:#c8d2e8;--text:#0F2835;--text-muted:#8098b8;--navy:#0F2835;--accent:#CA2E55;--green:#3a8c5c;--radius:8px;--mono:'JetBrains Mono',monospace;--sans:'Roboto',sans-serif;--font-h:'Geologica',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{width:100%;max-width:380px;}
.logo{text-align:center;margin-bottom:32px;}
.logo-mark{width:52px;height:52px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:18px;font-weight:900;color:#fff;margin:0 auto 12px;letter-spacing:-1px;}
.logo-sub{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase;}
.logo-name{font-size:22px;font-weight:700;letter-spacing:.01em;margin-top:6px;font-family:var(--font-h);color:var(--navy);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(15,40,53,.08);}
.ch{padding:12px 18px;border-bottom:1px solid var(--border);background:#fafbfd;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);}
.cb{padding:18px;}
.user-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.user-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;transition:all .15s;text-align:left;width:100%;}
.user-btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(202,46,85,.08);}
.user-btn.selected{border-color:var(--accent);background:var(--accent);color:white;}
.user-btn.selected .role{color:rgba(255,255,255,.7);}
.avatar{width:38px;height:38px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:14px;font-weight:700;flex-shrink:0;border:1px solid var(--border);color:var(--navy);}
.user-btn.selected .avatar{background:rgba(255,255,255,.2);border-color:transparent;color:white;}
.name{font-size:13px;font-weight:600;}
.role{font-size:11px;color:var(--text-muted);font-family:var(--mono);margin-top:1px;}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:14px;font-family:var(--sans);font-weight:600;cursor:pointer;background:var(--accent);color:white;transition:background .15s;}
.btn:hover{background:#a8243f;}
.btn:disabled{background:#ccc;cursor:default;}
.hint{text-align:center;margin-top:10px;font-size:11px;font-family:var(--mono);color:var(--text-muted);}
.version{text-align:center;margin-top:18px;font-family:var(--mono);font-size:10px;color:var(--text-muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">СК</div>
    <div class="logo-name">Сводка СК</div>
    <div class="logo-sub">Стройменеджер · строительный контроль</div>
  </div>
  <div class="card">
    <div class="ch">Выберите пользователя</div>
    <div class="cb">
      <div class="user-list" id="userList">
        <div style="text-align:center;padding:20px;font-family:var(--mono);font-size:11px;color:var(--text-muted)">Загрузка...</div>
      </div>
      <button class="btn" id="loginBtn" onclick="login()" disabled>Войти</button>
      <div class="hint">Вход по паролю будет добавлен в следующей версии</div>
    </div>
  </div>
  <div class="version">Разработано TeamJect для Stroymanager · 2026 · v1.3</div>
</div>
<script>
const API='https://sk.stroymanager.ru';
let selectedUserId=null,users=[];

async function loadUsers(){
  try{
    const r=await fetch(`${API}/api/users`).then(r=>r.json());
    users=(r.data||[]).filter(u=>u.is_active!==0);
    document.getElementById('userList').innerHTML=users.map(u=>{
      const initials=u.full_name.split(' ').slice(0,2).map(n=>n[0]).join('');
      const role=u.role==='admin'?'Администратор':u.role==='senior'?'Главный инженер':'Инженер СК';
      return `<button class="user-btn" onclick="select(${u.id},this)">
        <div class="avatar">${initials}</div>
        <div><div class="name">${u.full_name}</div><div class="role">${role}</div></div>
      </button>`;
    }).join('');
  }catch(e){
    document.getElementById('userList').innerHTML='<div style="color:var(--accent);font-size:12px;font-family:var(--mono)">Ошибка подключения к серверу.<br>Запустите: python3 app.py</div>';
  }
}

function select(id,el){
  document.querySelectorAll('.user-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  selectedUserId=id;
  document.getElementById('loginBtn').disabled=false;
}

function login(){
  if(!selectedUserId)return;
  const user=users.find(u=>u.id===selectedUserId);
  sessionStorage.setItem('userId',selectedUserId);
  sessionStorage.setItem('userRole',user.role);
  sessionStorage.setItem('userName',user.full_name);
  window.location.href=user.role==='admin'?'/admin.html':'/report.html';
}

loadUsers();
</script>
</body>
</html>
