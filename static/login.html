<!-- SK-pilot (СК-пилот) — система ежедневных сводок строительного контроля.
     Автор: Vladislav Nikonenko (идея и разработка). © 2026. Версия 1.3. -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Сводка СК</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;900&family=Roboto:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f3f9;--surface:#fff;--border:#c8d2e8;--text:#0F2835;--text-muted:#8098b8;--navy:#0F2835;--accent:#CA2E55;--green:#3a8c5c;--radius:8px;--mono:'JetBrains Mono',monospace;--sans:'Roboto',sans-serif;--font-h:'Geologica',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{width:100%;max-width:380px;}
.logo{text-align:center;margin-bottom:32px;}
.logo-mark{width:52px;height:52px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:18px;font-weight:900;color:#fff;margin:0 auto 12px;letter-spacing:-1px;}
.logo-sub{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase;}
.logo-name{font-size:22px;font-weight:700;letter-spacing:.01em;margin-top:6px;font-family:var(--font-h);color:var(--navy);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(15,40,53,.08);}
.ch{padding:12px 18px;border-bottom:1px solid var(--border);background:#fafbfd;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);}
.cb{padding:18px;}
.user-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.user-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;transition:all .15s;text-align:left;width:100%;}
.user-btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(202,46,85,.08);}
.user-btn.selected{border-color:var(--accent);background:var(--accent);color:white;}
.user-btn.selected .role{color:rgba(255,255,255,.7);}
.avatar{width:38px;height:38px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:14px;font-weight:700;flex-shrink:0;border:1px solid var(--border);color:var(--navy);}
.user-btn.selected .avatar{background:rgba(255,255,255,.2);border-color:transparent;color:white;}
.name{font-size:13px;font-weight:600;}
.role{font-size:11px;color:var(--text-muted);font-family:var(--mono);margin-top:1px;}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:14px;font-family:var(--sans);font-weight:600;cursor:pointer;background:var(--accent);color:white;transition:background .15s;}
.btn:hover{background:#a8243f;}
.btn:disabled{background:#ccc;cursor:default;}
.hint{text-align:center;margin-top:10px;font-size:11px;font-family:var(--mono);color:var(--text-muted);}
.fld{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--sans);background:var(--surface);color:var(--text);margin-bottom:9px;}
.fld:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(202,46,85,.08);}
.rowchk{display:flex;align-items:center;gap:8px;margin:2px 0 14px;font-size:13px;cursor:pointer;}
.rowchk input{width:16px;height:16px;appearance:auto;-webkit-appearance:auto;cursor:pointer;accent-color:var(--accent);}
.err{background:#fdecef;border:1px solid #f5c2cd;color:var(--accent);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;display:none;}
.sep{display:flex;align-items:center;gap:10px;margin:18px 0 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--border);}
.version{text-align:center;margin-top:18px;font-family:var(--mono);font-size:10px;color:var(--text-muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">СК</div>
    <div class="logo-name">Сводка СК</div>
    <div class="logo-sub">Стройменеджер · строительный контроль</div>
  </div>
  <div class="card">
    <div class="ch">Вход</div>
    <div class="cb">
      <div class="err" id="errBox"></div>

      <input class="fld" id="email" type="email" placeholder="Email" autocomplete="username" inputmode="email">
      <div style="position:relative">
        <input class="fld" id="password" type="password" placeholder="Пароль" autocomplete="current-password" style="padding-right:46px">
        <button type="button" id="pwdEye" onclick="togglePwd()" title="Показать пароль"
          style="position:absolute;right:6px;top:5px;width:34px;height:34px;border:none;background:none;cursor:pointer;font-size:16px;line-height:1;color:var(--text-muted)">👁</button>
      </div>
      <label class="rowchk"><input type="checkbox" id="remember"><span>Запомнить меня на 30 дней</span></label>
      <button class="btn" id="pwdBtn" onclick="loginPassword()">Войти</button>

      <div id="legacyBlock" style="display:none">
        <div class="sep">или выберите себя</div>
        <div class="user-list" id="userList"></div>
        <button class="btn" id="loginBtn" onclick="login()" disabled>Войти без пароля</button>
        <div class="hint">Временный вход — до выдачи пароля</div>
      </div>
    </div>
  </div>
  <div class="version">Разработано TeamJect для Stroymanager · 2026 · v1.3</div>
</div>
<script>
const API='https://sk.stroymanager.ru';
let selectedUserId=null,users=[];

// Роли: platform / root / admin / senior / engineer
const ADMIN_ROLES={root:1,admin:1};
const ROLE_LABELS={platform:'Оператор платформы',root:'Администратор',admin:'Администратор',senior:'Главный инженер',engineer:'Инженер СК'};
const roleLabel=r=>ROLE_LABELS[r]||'Инженер СК';

// Показ введённого пароля — ввод с телефона часто ошибочен
function togglePwd(){
  const f=document.getElementById('password'), b=document.getElementById('pwdEye');
  const show = f.type==='password';
  f.type = show ? 'text' : 'password';
  b.textContent = show ? '🙈' : '👁';
  b.title = show ? 'Скрыть пароль' : 'Показать пароль';
}

function showErr(msg){
  const b=document.getElementById('errBox');
  if(!msg){b.style.display='none';return;}
  b.textContent=msg; b.style.display='block';
}

// Единая точка перехода после успешного входа (любым способом)
function enter(user){
  sessionStorage.setItem('userId',user.id);
  sessionStorage.setItem('userRole',user.role);
  sessionStorage.setItem('userName',user.full_name);
  window.location.href=ADMIN_ROLES[user.role]?'/admin.html':'/report.html';
}

// ── Вход по email + паролю ──
async function loginPassword(){
  showErr('');
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password){showErr('Укажите email и пароль');return;}
  const btn=document.getElementById('pwdBtn');
  btn.disabled=true; btn.textContent='Проверяем...';
  try{
    const r=await fetch(`${API}/api/auth/login`,{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({email,password,remember:document.getElementById('remember').checked})
    }).then(r=>r.json());
    if(r.ok===false){showErr(r.error||'Неверный email или пароль');return;}
    enter(r.data);
  }catch(e){ showErr('Нет связи с сервером'); }
  finally{ btn.disabled=false; btn.textContent='Войти'; }
}

document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')loginPassword();});
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('password').focus();});

// ── Старый вход: список только тех, у кого пароля ещё нет ──
async function loadUsers(){
  try{
    const r=await fetch(`${API}/api/auth/login_users`,{credentials:'include'}).then(r=>r.json());
    users=r.data||[];
    if(!users.length) return;                         // все перешли на пароль
    document.getElementById('legacyBlock').style.display='';
    document.getElementById('userList').innerHTML=users.map(u=>{
      const initials=u.full_name.split(' ').slice(0,2).map(n=>n[0]).join('');
      return `<button class="user-btn" onclick="select(${u.id},this)">
        <div class="avatar">${initials}</div>
        <div><div class="name">${u.full_name}</div><div class="role">${roleLabel(u.role)}</div></div>
      </button>`;
    }).join('');
  }catch(e){
    showErr('Ошибка подключения к серверу');
  }
}

function select(id,el){
  document.querySelectorAll('.user-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  selectedUserId=id;
  document.getElementById('loginBtn').disabled=false;
}

async function login(){
  if(!selectedUserId)return;
  showErr('');
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;
  try{
    const r=await fetch(`${API}/api/auth/login_legacy`,{
      method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
      body:JSON.stringify({user_id:selectedUserId,remember:document.getElementById('remember').checked})
    }).then(r=>r.json());
    if(r.ok===false){showErr(r.error||'Не удалось войти');btn.disabled=false;return;}
    enter(r.data);
  }catch(e){ showErr('Нет связи с сервером'); btn.disabled=false; }
}

// «Запомнить меня»: sessionStorage не переживает закрытие браузера, cookie — да.
// Если серверная сессия жива, входим сразу.
async function restoreSession(){
  try{
    const r=await fetch(`${API}/api/auth/me`,{credentials:'include'}).then(r=>r.json());
    if(r.data&&r.data.id){ enter(r.data); return true; }
  }catch(e){}
  return false;
}

(async()=>{ if(await restoreSession())return; loadUsers(); })();
</script>
</body>
</html>
